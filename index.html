<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Intercept and suppress Vite HMR WebSocket connection errors in Cloud Run / AI Studio environment
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return String((a && a.message) || a || ''); }).join(' ');
          if (str.includes('[vite]') || str.includes('WebSocket') || str.includes('websocket') || str.includes('@vite/client')) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return String((a && a.message) || a || ''); }).join(' ');
          if (str.includes('[vite]') || str.includes('WebSocket') || str.includes('websocket')) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var msg = String(event.reason.message || event.reason || '');
            if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('@vite/client') || msg.includes('vite')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = String((event && event.message) || (event && event.error && event.error.message) || '');
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite]')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
